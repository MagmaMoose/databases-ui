{{- if not .Values.session.existingSecret }}
{{- $name := include "databases-ui.sessionSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The key that seals session cookies. Generated once and kept: a new key signs everyone out.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "databases-ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.session.key }}: {{ if and $existing (index $existing.data .Values.session.key) }}{{ index $existing.data .Values.session.key }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
